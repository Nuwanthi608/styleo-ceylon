<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLEO CEYLON | Luxury Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">STYLEO CEYLON</div>
        <nav class="nav-links" id="navLinks">
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="nav-actions">
            <button id="cartBtn">Bag (0)</button>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="main-content">
        <section class="hero" id="home">
            <h1>Modern Luxury Fashion</h1>
            <p>Designed for the Sri Lankan Lifestyle</p>
            <button class="cta-btn">Explore Collection</button>
        </section>

        <section class="products" id="shop">
            <h2>Featured Collections</h2>
            <div class="product-grid">
                <div class="card">
                    <div class="card-img"></div>
                    <h3>Silk Osariya</h3>
                    <p>LKR 25,000</p>
                </div>
                <div class="card">
                    <div class="card-img"></div>
                    <h3>Linen Designer Shirt</h3>
                    <p>LKR 8,500</p>
                </div>
                <div class="card">
                    <div class="card-img"></div>
                    <h3>Luxury Evening Dress</h3>
                    <p>LKR 18,000</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 STYLEO CEYLON. Powered by DecodeLabs Project 1.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
